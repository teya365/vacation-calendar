<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>휴가 관리</title>
</head>
<body>

<h2>휴가 등록</h2>

이름: <input id="name"><br>
날짜: <input id="date" type="date"><br>
구분: <input id="type"><br>

<button onclick="add()">추가</button>

<hr>

<div id="list"></div>

<script>
function add() {
  fetch('/add', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      name: name.value,
      date: date.value,
      type: type.value
    })
  }).then(load);
}

function load() {
  fetch('/list')
    .then(res => res.json())
    .then(data => {
      let html = '';
      data.forEach(d => {
        html += `<p>${d.name} / ${d.date} / ${d.type}</p>`;
      });
      document.getElementById('list').innerHTML = html;
    });
}

load();
</script>

</body>
</html>
